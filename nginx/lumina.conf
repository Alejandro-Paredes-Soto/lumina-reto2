# Server block de Nginx para Lumina
# Ruta simulada: http://localhost/lumina
#
# Instrucciones de instalación (Windows con Nginx o WSL/Linux):
# 1. Copia la carpeta del proyecto a: C:/nginx/html/lumina  (o /var/www/lumina)
# 2. Incluye este archivo en nginx.conf con: include conf/lumina.conf;
# 3. Reinicia Nginx: nginx -s reload

server {
    listen       80;
    server_name  localhost;

    # Raíz general del servidor (opcional)
    root   html;
    index  index.html;

    # Aplicación accesible en http://localhost/lumina
    location /lumina/ {
        alias   html/lumina/;
        index   index.html;
        try_files $uri $uri/ /lumina/index.html;
    }

    # Redirección limpia sin barra final
    location = /lumina {
        return 301 /lumina/;
    }

    # Caché básica para assets estáticos
    location ~* ^/lumina/.*\.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Compresión
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 256;

    error_page 404 /lumina/index.html;
}
